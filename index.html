<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk AI Background Replacer</title>
  
  <!-- MediaPipe AI Engine -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; min-height: 100vh; }
    .container { max-width: 1000px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; }
    #status { font-size: 13px; font-weight: 600; color: #d97706; }

    .upload-box {
      background: var(--surface);
      border: 2px dashed #94a3b8;
      border-radius: 12px;
      padding: 30px 16px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background 0.2s;
    }
    .upload-box:hover { background: #eff6ff; border-color: var(--primary); }
    .upload-box h3 { font-size: 16px; margin-bottom: 4px; }
    .upload-box p { font-size: 13px; color: var(--text-muted); }

    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }

    .palette-container { display: flex; align-items: center; gap: 10px; }
    .palette-label { font-size: 12px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .swatches { display: flex; gap: 8px; }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.25); transform: scale(1.08); }

    .btn {
      background: #0f172a;
      color: white;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-box {
      width: 100%;
      height: 240px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: repeating-conic-gradient(#e2e8f0 0% 25%, #ffffff 0% 50%) 50%/16px 16px;
    }
    .preview-box canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card-footer {
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
    }
    .file-name { font-size: 12px; color: var(--text); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-btn { font-size: 12px; font-weight: 700; color: var(--primary); text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Bulk Background Replacer</h1>
      <p id="status">Loading AI Engine...</p>
    </header>

    <div class="upload-box" id="uploadTrigger">
      <h3>Drop your photos here, or click to browse</h3>
      <p>Clean studio edge processing active</p>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <div class="toolbar">
      <div class="palette-container">
        <span class="palette-label">Backdrop:</span>
        <div class="swatches">
          <button class="swatch active" data-color="transparent" title="Transparent" style="background: repeating-conic-gradient(#cbd5e1 0% 25%, #fff 0% 50%) 50%/8px 8px;"></button>
          <button class="swatch" data-color="#ffffff" title="Solid White" style="background: #ffffff;"></button>
          <button class="swatch" data-color="#2563eb" title="Passport Blue" style="background: #2563eb;"></button>
          <button class="swatch" data-color="#ef4444" title="Solid Red" style="background: #ef4444;"></button>
          <button class="swatch" data-color="#10b981" title="Solid Green" style="background: #10b981;"></button>
          <button class="swatch" data-color="#0f172a" title="Dark Slate" style="background: #0f172a;"></button>
          <button class="swatch" data-color="gradient" title="Studio Gradient" style="background: linear-gradient(180deg, #93c5fd 0%, #1e40af 100%);"></button>
        </div>
      </div>
      <button class="btn" id="downloadAllBtn">Download All</button>
    </div>

    <div class="grid" id="gallery"></div>
  </div>

  <script>
    let activeColor = 'transparent';
    let selfieSegmentation = null;
    let queue = [];
    let isProcessing = false;
    const processedItems = [];

    const statusEl = document.getElementById('status');
    const uploadTrigger = document.getElementById('uploadTrigger');
    const fileInput = document.getElementById('fileInput');
    const gallery = document.getElementById('gallery');
    const swatches = document.querySelectorAll('.swatch');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    uploadTrigger.addEventListener('click', () => fileInput.click());

    function initAI() {
      try {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${file}`
        });

        selfieSegmentation.setOptions({
          modelSelection: 1 // High precision landscape model
        });

        selfieSegmentation.onResults(onResults);
        
        statusEl.textContent = 'AI Ready. Choose or drag photos to begin.';
        statusEl.style.color = '#16a34a';
      } catch (err) {
        statusEl.textContent = 'Failed to load AI engine: ' + err.message;
        statusEl.style.color = '#dc2626';
      }
    }
    window.addEventListener('load', initAI);

    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        activeColor = swatch.dataset.color;

        processedItems.forEach(item => {
          if (item.cleanCanvas) renderCanvas(item);
        });
      });
    });

    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const cardUI = createCardUI(file.name);
            const item = { name: file.name, img, cardUI, cleanCanvas: null };
            processedItems.push(item);
            queue.push(item);
            processQueue();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      fileInput.value = '';
    });

    function createCardUI(name) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="preview-box">
          <div class="loader-overlay">Queued...</div>
          <canvas style="display:none;"></canvas>
        </div>
        <div class="card-footer">
          <span class="file-name" title="${name}">${name}</span>
          <a class="dl-btn" style="display:none;">Save PNG</a>
        </div>
      `;
      gallery.appendChild(card);
      return {
        loader: card.querySelector('.loader-overlay'),
        canvas: card.querySelector('canvas'),
        dl: card.querySelector('.dl-btn')
      };
    }

    let currentProcessingItem = null;

    async function processQueue() {
      if (isProcessing || queue.length === 0) return;
      isProcessing = true;

      currentProcessingItem = queue.shift();
      currentProcessingItem.cardUI.loader.textContent = 'Removing edges...';

      try {
        await selfieSegmentation.send({ image: currentProcessingItem.img });
      } catch (e) {
        currentProcessingItem.cardUI.loader.textContent = 'Error processing';
        isProcessing = false;
        processQueue();
      }
    }

    // Edge-Cleaning Pipeline: Removes floating borders and dark fringes
    function onResults(results) {
      if (!currentProcessingItem) return;

      const w = results.image.width;
      const h = results.image.height;

      // 1. Render raw mask
      const rawMaskCanvas = document.createElement('canvas');
      rawMaskCanvas.width = w;
      rawMaskCanvas.height = h;
      const rawCtx = rawMaskCanvas.getContext('2d');
      rawCtx.drawImage(results.segmentationMask, 0, 0, w, h);

      const imgData = rawCtx.getImageData(0, 0, w, h);
      const data = imgData.data;

      // 2. Strict Thresholding (Eliminates low-confidence background debris)
      const binaryMask = new Uint8Array(w * h);
      for (let i = 0; i < data.length; i += 4) {
        // Values below 0.65 are forced to 0 (erases faint dark artifacts)
        binaryMask[i / 4] = (data[i] / 255 > 0.65) ? 255 : 0;
      }

      // 3. Morphological Erosion: Shrinks mask boundary inward by 1px to peel off edge halos
      const erodedMask = new Uint8Array(w * h);
      for (let y = 1; y < h - 1; y++) {
        for (let x = 1; x < w - 1; x++) {
          const idx = y * w + x;
          if (binaryMask[idx] === 255) {
            // Check 4-neighbor connectivity
            if (
              binaryMask[idx - 1] === 255 &&
              binaryMask[idx + 1] === 255 &&
              binaryMask[idx - w] === 255 &&
              binaryMask[idx + w] === 255
            ) {
              erodedMask[idx] = 255;
            } else {
              erodedMask[idx] = 0; // Cut boundary pixel
            }
          }
        }
      }

      // Write cleaned mask back to canvas
      for (let i = 0; i < erodedMask.length; i++) {
        const val = erodedMask[i];
        data[i * 4] = 255;
        data[i * 4 + 1] = 255;
        data[i * 4 + 2] = 255;
        data[i * 4 + 3] = val;
      }
      rawCtx.putImageData(imgData, 0, 0);

      // 4. Smooth Feathering: Apply a subtle 1px Gaussian blur to prevent jaggedness
      const smoothMaskCanvas = document.createElement('canvas');
      smoothMaskCanvas.width = w;
      smoothMaskCanvas.height = h;
      const sCtx = smoothMaskCanvas.getContext('2d');
      sCtx.filter = 'blur(1.5px)';
      sCtx.drawImage(rawMaskCanvas, 0, 0);

      // 5. Composite photo with the final smoothed mask
      const cleanCanvas = document.createElement('canvas');
      cleanCanvas.width = w;
      cleanCanvas.height = h;
      const cCtx = cleanCanvas.getContext('2d');

      cCtx.drawImage(smoothMaskCanvas, 0, 0);
      cCtx.globalCompositeOperation = 'source-in';
      cCtx.drawImage(results.image, 0, 0);

      currentProcessingItem.cleanCanvas = cleanCanvas;
      currentProcessingItem.cardUI.loader.style.display = 'none';
      currentProcessingItem.cardUI.canvas.style.display = 'block';
      currentProcessingItem.cardUI.dl.style.display = 'inline';

      renderCanvas(currentProcessingItem);

      isProcessing = false;
      currentProcessingItem = null;
      processQueue();
    }

    function renderCanvas(item) {
      const { cleanCanvas, cardUI } = item;
      const canvas = cardUI.canvas;
      const ctx = canvas.getContext('2d');
      const w = cleanCanvas.width;
      const h = cleanCanvas.height;

      canvas.width = w;
      canvas.height = h;

      ctx.clearRect(0, 0, w, h);

      // Draw active backdrop
      if (activeColor === 'gradient') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#93c5fd');
        grad.addColorStop(1, '#1e40af');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else if (activeColor !== 'transparent') {
        ctx.fillStyle = activeColor;
        ctx.fillRect(0, 0, w, h);
      }

      // Draw cleanly cut out subject
      ctx.drawImage(cleanCanvas, 0, 0);

      const dataUrl = canvas.toDataURL('image/png');
      cardUI.dl.href = dataUrl;
      cardUI.dl.download = `cutout_${item.name.replace(/\.[^/.]+$/, '')}.png`;
    }

    downloadAllBtn.addEventListener('click', () => {
      processedItems.forEach(item => {
        if (item.cardUI && item.cardUI.dl && item.cardUI.dl.href) {
          item.cardUI.dl.click();
        }
      });
    });
  </script>
</body>
</html>
