<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk Photo Background Studio</title>
  
  <!-- MediaPipe AI Engine (Compatible with Windows 7 Chrome & Mobile) -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/selfie_segmentation.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }
    .container { max-width: 1100px; margin: 0 auto; }

    header { text-align: center; margin-bottom: 24px; }
    header h1 { font-size: 26px; font-weight: 700; margin-bottom: 6px; }
    #status { font-size: 14px; font-weight: 600; color: #d97706; }

    /* Upload Zone */
    .upload-box {
      background: var(--surface);
      border: 2px dashed #94a3b8;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      margin-bottom: 24px;
      transition: all 0.2s;
    }
    .upload-box:hover { border-color: var(--primary); background: #eff6ff; }
    .upload-box h3 { font-size: 18px; margin-bottom: 4px; }
    .upload-box p { font-size: 13px; color: var(--text-muted); }

    /* Toolbar */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .palette-container { display: flex; align-items: center; gap: 10px; }
    .palette-label { font-size: 13px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
    .swatches { display: flex; gap: 8px; }
    .swatch {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #cbd5e1;
      cursor: pointer;
      outline: none;
      transition: transform 0.15s;
    }
    .swatch:hover { transform: scale(1.1); }
    .swatch.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.25); transform: scale(1.08); }

    .btn {
      background: #0f172a;
      color: white;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 13px;
      border: none;
      cursor: pointer;
    }
    .btn:hover { opacity: 0.9; }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-box {
      width: 100%;
      height: 240px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: repeating-conic-gradient(#e2e8f0 0% 25%, #ffffff 0% 50%) 50%/16px 16px;
      overflow: hidden;
    }
    .preview-box canvas { max-width: 100%; max-height: 100%; object-fit: contain; }

    .loader-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .card-footer {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
    }
    .file-name { font-size: 12px; color: var(--text); max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dl-btn { font-size: 12px; font-weight: 700; color: var(--primary); text-decoration: none; cursor: pointer; }
    .dl-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>AI Bulk Background Replacer</h1>
      <p id="status">Loading AI Engine...</p>
    </header>

    <!-- Upload area -->
    <div class="upload-box" id="uploadTrigger">
      <h3>Drop your photos here, or click to browse</h3>
      <p>Supports passport photos, selfies, and group shots in bulk (JPG, PNG, WebP)</p>
      <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">
    </div>

    <!-- Controls -->
    <div class="toolbar">
      <div class="palette-container">
        <span class="palette-label">Backdrop:</span>
        <div class="swatches">
          <button class="swatch active" data-color="transparent" title="Transparent" style="background: repeating-conic-gradient(#cbd5e1 0% 25%, #fff 0% 50%) 50%/8px 8px;"></button>
          <button class="swatch" data-color="#ffffff" title="Solid White" style="background: #ffffff;"></button>
          <button class="swatch" data-color="#2563eb" title="Passport Blue" style="background: #2563eb;"></button>
          <button class="swatch" data-color="#ef4444" title="Solid Red" style="background: #ef4444;"></button>
          <button class="swatch" data-color="#10b981" title="Solid Green" style="background: #10b981;"></button>
          <button class="swatch" data-color="#0f172a" title="Dark Slate" style="background: #0f172a;"></button>
          <button class="swatch" data-color="gradient" title="Studio Gradient" style="background: linear-gradient(180deg, #93c5fd 0%, #1e40af 100%);"></button>
        </div>
      </div>
      <button class="btn" id="downloadAllBtn">Download All</button>
    </div>

    <!-- Gallery Grid -->
    <div class="grid" id="gallery"></div>
  </div>

  <script>
    let activeColor = 'transparent';
    let selfieSegmentation = null;
    let queue = [];
    let isProcessing = false;
    const processedItems = [];

    const statusEl = document.getElementById('status');
    const uploadTrigger = document.getElementById('uploadTrigger');
    const fileInput = document.getElementById('fileInput');
    const gallery = document.getElementById('gallery');
    const swatches = document.querySelectorAll('.swatch');
    const downloadAllBtn = document.getElementById('downloadAllBtn');

    uploadTrigger.addEventListener('click', () => fileInput.click());

    // 1. Initialize Google MediaPipe Model
    function initAI() {
      try {
        selfieSegmentation = new SelfieSegmentation({
          locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation@0.1.1675465747/${file}`
        });

        selfieSegmentation.setOptions({
          modelSelection: 1 // 1 = General High-Accuracy model
        });

        selfieSegmentation.onResults(onResults);
        
        statusEl.textContent = 'AI Ready. Choose or drag photos to begin.';
        statusEl.style.color = '#16a34a';
      } catch (err) {
        statusEl.textContent = 'Failed to load AI engine: ' + err.message;
        statusEl.style.color = '#dc2626';
      }
    }
    window.addEventListener('load', initAI);

    // 2. Palette Swatches
    swatches.forEach(swatch => {
      swatch.addEventListener('click', () => {
        swatches.forEach(s => s.classList.remove('active'));
        swatch.classList.add('active');
        activeColor = swatch.dataset.color;

        processedItems.forEach(item => {
          if (item.results) renderCanvas(item);
        });
      });
    });

    // 3. Upload Handling
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const cardUI = createCardUI(file.name);
            const item = { name: file.name, img, cardUI, results: null };
            processedItems.push(item);
            queue.push(item);
            processQueue();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      fileInput.value = '';
    });

    function createCardUI(name) {
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="preview-box">
          <div class="loader-overlay">Queued...</div>
          <canvas style="display:none;"></canvas>
        </div>
        <div class="card-footer">
          <span class="file-name" title="${name}">${name}</span>
          <a class="dl-btn" style="display:none;">Save PNG</a>
        </div>
      `;
      gallery.appendChild(card);
      return {
        loader: card.querySelector('.loader-overlay'),
        canvas: card.querySelector('canvas'),
        dl: card.querySelector('.dl-btn')
      };
    }

    let currentProcessingItem = null;

    async function processQueue() {
      if (isProcessing || queue.length === 0) return;
      isProcessing = true;

      currentProcessingItem = queue.shift();
      currentProcessingItem.cardUI.loader.textContent = 'AI Matting...';

      try {
        await selfieSegmentation.send({ image: currentProcessingItem.img });
      } catch (e) {
        currentProcessingItem.cardUI.loader.textContent = 'Error processing';
        isProcessing = false;
        processQueue();
      }
    }

    // 4. Smooth Compositing (Solves the jagged border issue)
    function onResults(results) {
      if (!currentProcessingItem) return;

      currentProcessingItem.results = results;
      currentProcessingItem.cardUI.loader.style.display = 'none';
      currentProcessingItem.cardUI.canvas.style.display = 'block';
      currentProcessingItem.cardUI.dl.style.display = 'inline';

      renderCanvas(currentProcessingItem);

      isProcessing = false;
      currentProcessingItem = null;
      processQueue();
    }

    function renderCanvas(item) {
      const { results, cardUI } = item;
      const canvas = cardUI.canvas;
      const ctx = canvas.getContext('2d');
      const w = results.image.width;
      const h = results.image.height;

      canvas.width = w;
      canvas.height = h;

      ctx.save();
      ctx.clearRect(0, 0, w, h);

      // Step A: Draw New Background Color / Gradient
      if (activeColor === 'gradient') {
        const grad = ctx.createLinearGradient(0, 0, 0, h);
        grad.addColorStop(0, '#93c5fd');
        grad.addColorStop(1, '#1e40af');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      } else if (activeColor !== 'transparent') {
        ctx.fillStyle = activeColor;
        ctx.fillRect(0, 0, w, h);
      }

      // Step B: Create feathered mask on an offscreen buffer
      const maskCanvas = document.createElement('canvas');
      maskCanvas.width = w;
      maskCanvas.height = h;
      const mCtx = maskCanvas.getContext('2d');

      // 1. Draw smooth probability mask
      mCtx.drawImage(results.segmentationMask, 0, 0, w, h);

      // 2. Keep only the person inside the alpha boundaries
      mCtx.globalCompositeOperation = 'source-in';
      mCtx.drawImage(results.image, 0, 0, w, h);

      // Step C: Draw the smoothly matted person over the background
      ctx.drawImage(maskCanvas, 0, 0);
      ctx.restore();

      // Update link
      const dataUrl = canvas.toDataURL('image/png');
      cardUI.dl.href = dataUrl;
      cardUI.dl.download = `cutout_${item.name.replace(/\.[^/.]+$/, '')}.png`;
    }

    // 5. Download All
    downloadAllBtn.addEventListener('click', () => {
      processedItems.forEach(item => {
        if (item.cardUI && item.cardUI.dl && item.cardUI.dl.href) {
          item.cardUI.dl.click();
        }
      });
    });
  </script>
</body>
</html>
